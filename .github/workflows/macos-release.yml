name: macOS Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: macos-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-latest
    env:
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v4

      - name: Require Apple release credentials
        shell: bash
        run: |
          required=(
            APPLE_CERTIFICATE
            APPLE_CERTIFICATE_PASSWORD
            KEYCHAIN_PASSWORD
            APPLE_ID
            APPLE_PASSWORD
            APPLE_TEAM_ID
          )
          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing required repository secret: $name"
              exit 1
            fi
          done

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Import Developer ID Application certificate
        shell: bash
        run: |
          certificate_path="$RUNNER_TEMP/codexpet-developer-id.p12"
          keychain_path="$RUNNER_TEMP/codexpet-signing.keychain-db"

          echo "$APPLE_CERTIFICATE" | base64 --decode > "$certificate_path"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain_path"
          security import "$certificate_path" \
            -k "$keychain_path" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$keychain_path"
          security list-keychains -d user -s "$keychain_path"

          signing_identity="$({ security find-identity -v -p codesigning "$keychain_path" || true; } \
            | sed -n 's/.*"\(Developer ID Application: [^"]*\)".*/\1/p' \
            | head -1)"
          if [[ -z "$signing_identity" ]]; then
            echo "::error::No Developer ID Application identity was found in APPLE_CERTIFICATE"
            exit 1
          fi

          echo "APPLE_SIGNING_IDENTITY=$signing_identity" >> "$GITHUB_ENV"
          echo "SIGNING_KEYCHAIN=$keychain_path" >> "$GITHUB_ENV"
          rm -f "$certificate_path"

      - name: Build signed and notarized app and DMG
        working-directory: apps/desktop-tauri
        run: pnpm tauri build --bundles app,dmg

      - name: Verify signed and notarized artifacts
        id: verify
        shell: bash
        run: |
          bundle_root="apps/desktop-tauri/src-tauri/target/release/bundle"
          app_path="$(find "$bundle_root/macos" -maxdepth 1 -name '*.app' -print -quit)"
          dmg_path="$(find "$bundle_root/dmg" -maxdepth 1 -name '*.dmg' -print -quit)"

          if [[ -z "$app_path" || -z "$dmg_path" ]]; then
            echo "::error::Tauri did not produce both a macOS app and DMG"
            exit 1
          fi

          codesign --verify --deep --strict --verbose=2 "$app_path"
          spctl --assess --type execute --verbose=4 "$app_path"
          xcrun stapler validate "$app_path"
          xcrun stapler validate "$dmg_path"
          spctl --assess \
            --type open \
            --context context:primary-signature \
            --verbose=4 \
            "$dmg_path"

          echo "dmg_path=$dmg_path" >> "$GITHUB_OUTPUT"

      - name: Publish verified DMG
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.verify.outputs.dmg_path }}
          generate_release_notes: true
          draft: false
          prerelease: false

      - name: Delete temporary signing keychain
        if: always()
        shell: bash
        run: |
          if [[ -n "${SIGNING_KEYCHAIN:-}" && -f "$SIGNING_KEYCHAIN" ]]; then
            security delete-keychain "$SIGNING_KEYCHAIN"
          fi
